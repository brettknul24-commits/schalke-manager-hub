<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0756a5"><meta name="apple-mobile-web-app-capable" content="yes"><title>Schalke 04 · Manager Hub</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#12243c;background:#f1f5fb}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(140deg,#004a97,#087bd3);color:white;padding:22px 18px 26px;border-radius:0 0 22px 22px}header small{opacity:.85;letter-spacing:.13em;font-weight:700}h1{font-size:25px;margin:5px 0}h2{font-size:19px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}.sub{color:#63758e;font-size:13px}.wrap{max-width:760px;margin:auto;padding:16px 14px 95px}.card{background:white;border:1px solid #dce5f1;border-radius:17px;padding:16px;margin-bottom:13px;box-shadow:0 3px 15px #1a41710a}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{text-align:center;background:#edf5ff;border-radius:12px;padding:12px 4px}.stat b{display:block;color:#0756a5;font-size:24px}.stat span{font-size:11px;color:#60738b}.btn{border:0;border-radius:11px;padding:12px 14px;background:#075eb4;color:white;font-weight:700;font-size:14px;cursor:pointer}.btn.secondary{background:#e7f1ff;color:#0756a5}.btn.danger{background:#fff0f0;color:#a72222}.btn:active{transform:scale(.98)}.actions{display:flex;flex-wrap:wrap;gap:8px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.item{padding:12px 0;border-bottom:1px solid #e9edf3}.item:last-child{border:0}.pill{font-size:11px;font-weight:700;background:#e5f2ff;color:#0756a5;padding:5px 9px;border-radius:30px;white-space:nowrap}.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #d8e2f0;display:flex;justify-content:space-around;padding:7px 3px max(9px,env(safe-area-inset-bottom));z-index:5}.nav button{background:none;border:0;color:#60758d;font-size:10px;font-weight:650;min-width:53px;padding:6px 2px}.nav button.active{color:#0756a5}.nav .emoji{font-size:20px;display:block;margin-bottom:3px}label{display:block;font-size:12px;font-weight:700;color:#425a74;margin:10px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid #cbd9e9;border-radius:10px;font:inherit;background:#fff;color:#142840}textarea{min-height:70px}form .actions{margin-top:16px}dialog{border:0;border-radius:18px;padding:0;width:calc(100% - 24px);max-width:510px;max-height:85vh;overflow:auto;box-shadow:0 15px 60px #061f4460}dialog::backdrop{background:#081e3b99}.modalhead{position:sticky;top:0;background:#0756a5;color:white;padding:15px;z-index:1}.modalbody{padding:16px}.muted{color:#687b91;font-size:12px}.empty{text-align:center;padding:28px 12px;color:#71829a}.tag{font-size:11px;border-radius:7px;background:#eff3f8;padding:4px 7px}.search{margin-bottom:13px}.score{font-size:23px;font-weight:800;color:#0756a5}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:#14375e;color:white;padding:12px 16px;border-radius:11px;display:none;z-index:9;max-width:90%;text-align:center;font-size:13px}@media(min-width:600px){.wrap{padding-top:25px}.nav{max-width:760px;margin:auto;border-radius:18px 18px 0 0}}
</style></head><body><header><small>FC SCHALKE 04 · 2026/27</small><h1>Manager Hub <span style="font-size:16px">⚽</span></h1><div style="opacity:.88;font-size:13px">De digitale directiekamer</div></header><main class="wrap" id="app"></main><nav class="nav" id="nav"></nav><dialog id="modal"><div class="modalhead row"><strong id="modalTitle">Registreren</strong><button class="btn secondary" onclick="document.getElementById('modal').close()">✕</button></div><div class="modalbody" id="modalBody"></div></dialog><div class="toast" id="toast"></div><script>
const TABS=[['dashboard','🏠','Home'],['Wedstrijden','⚽','Match'],['Selectie','👥','Selectie'],['Scouting','🔎','Scouting'],['meer','📋','Meer']];let data={},tab='dashboard',subtab='Transfers';const DB='schalke-manager-hub-v1';
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const E=escapeHTML;
function save(){try{localStorage.setItem(DB,JSON.stringify(data));}catch(e){alert('Opslaan mislukt. Maak een back-up.')}}
function toast(t){let el=document.getElementById('toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',2200)}
function openModal(title,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').showModal()}
function nav(){document.getElementById('nav').innerHTML=TABS.map(([id,icon,name])=>`<button class="${tab===id?'active':''}" onclick="switchTab('${id}')"><span class="emoji">${icon}</span>${name}</button>`).join('')}
function switchTab(t){tab=t;render();window.scrollTo(0,0)}
function played(){return data.Wedstrijden.filter(x=>x.gf!==null&&x.gf!==''&&x.ga!==null&&x.ga!==''&&x.status!=='Gepland')}
function stats(){let a=played();return {games:a.length,wins:a.filter(x=>+x.gf>+x.ga).length,goals:a.reduce((s,x)=>s+(+x.gf||0),0),against:a.reduce((s,x)=>s+(+x.ga||0),0),clean:a.filter(x=>+x.ga===0).length}}
function dashboard(){let s=stats(),next=data.Wedstrijden.find(x=>x.status==='Gepland'),inj=data.Selectie.filter(x=>/gebles|bless/i.test(x.status||''));return `<div class="card"><div class="row"><h2>Cluboverzicht</h2><span class="pill">${E(data.settings.season)}</span></div><div class="stats"><div class="stat"><b>${s.wins}/${s.games}</b><span>Overwinningen</span></div><div class="stat"><b>${s.goals}–${s.against}</b><span>Doelsaldo</span></div><div class="stat"><b>${s.clean}</b><span>Clean sheets</span></div></div><p class="muted">Totaal van alle ingevoerde afgeronde wedstrijden, inclusief voorbereiding.</p></div><div class="card"><h2>Volgende wedstrijd</h2>${next?`<div class="row"><strong>Schalke 04 — ${E(next.opponent)}</strong><span class="pill">${E(next.competition)}</span></div>`:'<div class="empty">Geen geplande wedstrijd</div>'}<div class="actions" style="margin-top:14px"><button class="btn" onclick="newMatch()">+ Wedstrijd</button><button class="btn secondary" onclick="newEvent()">+ Wedstrijdmoment</button></div></div><div class="card"><h2>Directie-alerts</h2>${inj.length?inj.map(x=>`<div class="item">🚑 <strong>${E(x.name)}</strong><div class="sub">${E(x.notes||x.status)}</div></div>`).join(''):'<p class="sub">Geen actieve blessures geregistreerd.</p>'}<div class="item">🔎 ${data.Scouting.filter(x=>x.status==='In onderzoek').length} scoutingdossiers in onderzoek</div><div class="item">📋 ${data.Besluiten.length} directiebesluiten geregistreerd</div></div><div class="card"><h2>Laatste uitslagen</h2>${played().slice(-3).reverse().map(x=>`<div class="item row"><div><b>${E(x.opponent)}</b><div class="sub">${E(x.competition)}</div></div><div class="score">${E(x.gf)}–${E(x.ga)}</div></div>`).join('')}</div>`}
function listPage(name){let arr=data[name]||[];let title={Wedstrijden:'Wedstrijdcentrum',Selectie:'Selectiebeheer',Scouting:'Scoutingdossiers',Transfers:'Transfers',Contracten:'Contracten',Besluiten:'Directiebesluiten',Spelerstats:'Spelerstatistieken'}[name]||name;return `<div class="row" style="margin-bottom:12px"><h2>${title}</h2><button class="btn" onclick="editRecord('${name}',-1)">+ Nieuw</button></div><input class="search" placeholder="Zoek in ${title.toLowerCase()}…" oninput="filterItems(this.value)" id="search"><div id="records">${records(name,arr)}</div>`}
function records(name,arr){if(!arr.length)return '<div class="card empty">Nog geen gegevens.</div>';return arr.map((x)=>{let idx=data[name].indexOf(x);let primary=x.name||x.opponent||x.subject||'Onbekend';let secondary= name==='Wedstrijden'?`${x.competition} · ${x.status}`:name==='Selectie'?`${x.position} · ALG ${x.rating??'?'} · ${x.status}`:name==='Scouting'?`${x.club} · ${x.position} · ${x.status}`:name==='Transfers'?`${x.type} · ${x.club||'—'} · ${x.status}`:name==='Contracten'?`${x.years} jaar · €${(+x.wage||0).toLocaleString('nl-NL')}/week`:name==='Spelerstats'?`${x.goals||0} goals · ${x.assists||0} assists`:`${x.meeting} · ${x.status}`;let extra=name==='Wedstrijden'&&x.gf!==null&&x.gf!==''?`<span class="score">${E(x.gf)}–${E(x.ga)}</span>`:name==='Scouting'?`<span class="pill">${E(x.rating??'?')} ALG</span>`:'';return `<div class="card record" data-search="${E(JSON.stringify(x).toLowerCase())}"><div class="row"><div style="min-width:0"><strong>${E(primary)}</strong><div class="sub" style="margin-top:5px">${E(secondary)}</div></div>${extra}</div>${x.notes?`<div class="muted" style="margin-top:8px">${E(x.notes)}</div>`:''}<div class="actions" style="margin-top:12px"><button class="btn secondary" onclick="editRecord('${name}',${idx})">Bewerken</button><button class="btn danger" onclick="deleteRecord('${name}',${idx})">Verwijderen</button></div></div>`}).join('')}
function filterItems(q){document.querySelectorAll('.record').forEach(el=>el.style.display=el.dataset.search.includes(q.toLowerCase())?'':'none')}
const fields={Wedstrijden:[['competition','Competitie'],['opponent','Tegenstander'],['venue','Thuis / uit'],['gf','Goals Schalke','number'],['ga','Goals tegen','number'],['status','Status'],['scorers','Doelpuntenmakers'],['assists','Assists'],['notes','Notities','textarea']],Selectie:[['name','Speler'],['position','Positie'],['rating','ALG','number'],['role','Rol'],['status','Status'],['notes','Notities','textarea']],Scouting:[['name','Speler'],['club','Club'],['position','Positie'],['age','Leeftijd','number'],['rating','ALG','number'],['price','Vraagprijs (€)','number'],['status','Status'],['notes','Scoutingnotities','textarea']],Transfers:[['name','Speler'],['type','Type'],['club','Tegenpartij'],['amount','Kasimpact (€; verkoop positief)','number'],['status','Status'],['notes','Notities','textarea']],Contracten:[['name','Speler'],['years','Looptijd (jaren)','number'],['wage','Weekloon (€)','number'],['bonus','Tekengeld (€)','number'],['agent','Agentkosten (€)','number'],['role','Rol'],['notes','Notities','textarea']],Besluiten:[['meeting','Vergadering'],['subject','Onderwerp'],['status','Status'],['owner','Verantwoordelijke'],['decision','Besluit','textarea']],Spelerstats:[['name','Speler'],['goals','Goals','number'],['assists','Assists','number'],['period','Periode'],['notes','Toelichting','textarea']]};
function editRecord(name,idx){let obj=idx<0?{}:data[name][idx];let html=`<form id="editform">${fields[name].map(([key,label,type])=>`<label for="f_${key}">${label}</label>${type==='textarea'?`<textarea id="f_${key}" name="${key}">${E(obj[key]??'')}</textarea>`:`<input id="f_${key}" name="${key}" type="${type||'text'}" ${type==='number'?'step="any"':''} value="${E(obj[key]??'')}">`}`).join('')}<div class="actions"><button class="btn" type="submit">Opslaan</button><button class="btn secondary" type="button" onclick="document.getElementById('modal').close()">Annuleren</button></div></form>`;openModal(idx<0?'Nieuw item':'Item bewerken',html);document.getElementById('editform').onsubmit=e=>{e.preventDefault();let v={...obj};for(let [key,,type] of fields[name]){let raw=e.target.elements[key].value;v[key]=type==='number'?(raw===''?null:Number(raw)):raw.trim()}if(idx<0){v.id=v.id||`${name.slice(0,1)}${Date.now()}`;data[name].push(v)}else data[name][idx]=v;save();document.getElementById('modal').close();render();toast('Opgeslagen op je telefoon')}}
function deleteRecord(name,idx){if(confirm('Dit item definitief verwijderen?')){data[name].splice(idx,1);save();render()}}
function newMatch(){switchTab('Wedstrijden');editRecord('Wedstrijden',-1)}
function newEvent(){let options=data.Selectie.map(x=>`<option value="${E(x.name)}">${E(x.name)}</option>`).join('');openModal('Wedstrijdmoment registreren',`<form id="eventForm"><label>Wedstrijd</label><select name="match">${data.Wedstrijden.map((x,i)=>`<option value="${i}">${E(x.opponent)} (${E(x.competition)})</option>`).join('')}</select><label>Minuut</label><input name="minute" type="number" min="1" max="130" placeholder="bijv. 50"><label>Gebeurtenis</label><select name="type"><option>Doelpunt</option><option>Assist</option><option>Wissel</option><option>Blessure</option><option>Gele kaart</option><option>Rode kaart</option><option>Notitie</option></select><label>Speler</label><select name="player"><option value="">—</option>${options}</select><label>Toelichting</label><textarea name="notes" placeholder="Bijv. assist van Sylla"></textarea><div class="actions"><button class="btn">Moment opslaan</button></div></form>`);document.getElementById('eventForm').onsubmit=e=>{e.preventDefault();let f=e.target.elements;data.events.push({match:data.Wedstrijden[+f.match.value]?.id,minute:f.minute.value,type:f.type.value,player:f.player.value,notes:f.notes.value});save();document.getElementById('modal').close();toast('Wedstrijdmoment opgeslagen');render()}}
function more(){return `<div class="card"><h2>Clubadministratie</h2><div class="actions">${['Transfers','Contracten','Spelerstats','Besluiten'].map(x=>`<button class="btn ${subtab===x?'':'secondary'}" onclick="subtab='${x}';render()">${x}</button>`).join('')}</div></div>${listPage(subtab)}<div class="card"><h2>Wedstrijdmomenten</h2><button class="btn secondary" onclick="newEvent()">+ Moment toevoegen</button>${data.events.slice().reverse().map((x,i)=>`<div class="item"><b>${E(x.minute)}' ${E(x.type)} · ${E(x.player)}</b><div class="sub">${E(x.notes)}</div></div>`).join('')||'<p class="sub">Nog geen losse momenten vastgelegd.</p>'}</div><div class="card"><h2>Gegevens & back-up</h2><p class="sub">Alles wordt lokaal op dit toestel bewaard. Wis je browsergegevens niet zonder back-up.</p><div class="actions"><button class="btn" onclick="exportData()">⬇ JSON-back-up</button><button class="btn secondary" onclick="document.getElementById('importfile').click()">⬆ Back-up herstellen</button></div><input id="importfile" type="file" accept="application/json,.json" style="display:none" onchange="importData(event)"><p class="muted">Een back-up is nodig om gegevens bij een nieuwe telefoon of browserreset te behouden.</p></div>`}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='schalke-manager-hub-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importData(e){let file=e.target.files[0];if(!file)return;try{let d=JSON.parse(await file.text());if(!d.Wedstrijden||!d.Selectie||!d.Scouting)throw Error('Geen geldige back-up');if(!confirm('Huidige gegevens vervangen door deze back-up?'))return;data=d;data.events??=[];save();render();toast('Back-up hersteld')}catch(err){alert('Import mislukt: '+err.message)}}
function render(){nav();document.getElementById('app').innerHTML=tab==='dashboard'?dashboard():tab==='meer'?more():listPage(tab)}
async function start(){let saved=localStorage.getItem(DB);if(saved){try{data=JSON.parse(saved)}catch(e){}}if(!data.Wedstrijden){try{data=await (await fetch('seed.json')).json()}catch(e){document.getElementById('app').innerHTML='<div class="card">Open deze app via een webserver of gehoste URL. Rechtstreeks openen als bestand ondersteunt niet alle functies.</div>';return}save()}data.events??=[];render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{})}start();
</script></body></html>
